<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Estate Finder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17202a;--muted:#667085;--line:#e4e7ec;--accent:#1769aa;--soft:#e8f1f8;--good:#16834b;--shadow:0 2px 10px rgba(16,24,40,.06)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:19px}.status{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:292px minmax(420px,1fr) 430px;min-height:calc(100vh - 68px)}aside,.detail{background:#fff;padding:20px;border-right:1px solid var(--line);overflow:auto}aside{position:sticky;top:68px;height:calc(100vh - 68px)}.detail{border-left:1px solid var(--line);border-right:0;position:sticky;top:68px;height:calc(100vh - 68px)}.results{padding:20px;min-width:0}.group{border-top:1px solid var(--line);padding:16px 0}.group:first-child{border-top:0;padding-top:0}.gt{font-size:12px;font-weight:800;text-transform:uppercase;margin-bottom:10px;color:#344054}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:9px 10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;min-height:40px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks{display:grid;gap:7px}.check{display:flex;gap:8px;align-items:center;font-size:13px}.check input{width:17px;height:17px}.actions{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:12px}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2f6;color:var(--text)}.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sort{padding:9px;border:1px solid #d0d5dd;border-radius:8px;background:#fff}.chipsbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.active-chip,.chip{display:inline-block;border-radius:999px;padding:5px 8px;font-size:11px}.active-chip{background:var(--soft);color:#13547f;cursor:pointer}.chip{background:#f0f3f6}.source-badge{display:inline-block;background:#17202a;color:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;margin-right:6px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:220px 1fr;overflow:hidden;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow)}.thumb{width:220px;height:176px;object-fit:cover;background:#e9edf1}.cardbody{padding:14px}.price{font-size:21px;font-weight:800}.meta{color:var(--muted);font-size:13px;margin:6px 0 10px}.title{font-weight:700;margin-bottom:8px}.score{float:right;color:var(--good);font-size:12px;font-weight:800}.chips{display:flex;gap:6px;flex-wrap:wrap}.empty{padding:50px 20px;text-align:center;color:var(--muted)}.hero{width:100%;height:250px;object-fit:cover;border-radius:10px;background:#eef1f4}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}.gallery img{width:100%;height:70px;object-fit:cover;border-radius:7px}.detail .price{font-size:27px;margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.metric{border:1px solid var(--line);border-radius:8px;padding:9px}.metric b{display:block;font-size:15px}.metric span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.section{border-top:1px solid var(--line);padding:15px 0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.kv div{display:flex;justify-content:space-between;gap:8px}.kv span{color:var(--muted)}.source{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.source a{color:var(--accent);font-weight:700;text-decoration:none}.mobile{display:none}@media(max-width:1180px){.layout{grid-template-columns:270px 1fr}.detail{display:none}}@media(max-width:720px){.top{height:60px;padding:0 14px}.layout{display:block}.mobile{display:flex;padding:10px;gap:8px;background:#fff;border-bottom:1px solid var(--line)}.mobile .btn{flex:1}aside{display:none;position:fixed;z-index:30;inset:60px 0 0;height:auto}.results{padding:12px}.card{grid-template-columns:125px 1fr}.thumb{width:125px;height:150px}.cardbody{padding:11px}.price{font-size:18px}.metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="brand">Real Estate Finder</div><div id="status" class="status">Conectando…</div></header>
<div class="mobile"><button class="btn" id="open">Filtros</button><button class="btn secondary" id="mobileReset">Limpiar</button></div>
<div class="layout">
<aside id="filters">
<div class="group"><h2 style="margin:0 0 14px">Filtros</h2>
<div class="gt">Ubicación</div><div class="field"><label>Municipio</label><select id="municipality"><option value="">Todos</option></select></div><div class="field"><label>Población</label><select id="population" disabled><option value="">Todas</option></select></div><div class="field"><label>Barrio</label><select id="neighborhood" disabled><option value="">Todos</option></select></div></div>
<div class="group"><div class="gt">Precio y superficie</div><div class="grid2"><div class="field"><label>Precio mín.</label><input id="minPrice" type="number" min="0"></div><div class="field"><label>Precio máx.</label><input id="maxPrice" type="number" min="0"></div></div><div class="grid2"><div class="field"><label>m² útiles mín.</label><input id="minUseful" type="number" min="0"></div><div class="field"><label>m² construidos mín.</label><input id="minBuilt" type="number" min="0"></div></div><div class="grid2"><div class="field"><label>Habitaciones mín.</label><input id="minBeds" type="number" min="0"></div><div class="field"><label>Baños mín.</label><input id="minBaths" type="number" min="0"></div></div></div>
<div class="group"><div class="gt">Características</div><div class="checks"><label class="check"><input id="elevator" type="checkbox"> Ascensor</label><label class="check"><input id="parking" type="checkbox"> Parking</label><label class="check"><input id="terrace" type="checkbox"> Terraza</label><label class="check"><input id="exterior" type="checkbox"> Exterior</label><label class="check"><input id="habitable" type="checkbox"> Habitable</label><label class="check"><input id="available" type="checkbox"> Listo para entrar</label></div></div>
<div class="group"><div class="gt">Situación jurídica</div><div class="checks"><label class="check"><input id="excludeOccupied" type="checkbox" checked> Excluir ocupados</label><label class="check"><input id="excludeRented" type="checkbox" checked> Excluir alquilados</label><label class="check"><input id="excludeNoPossession" type="checkbox" checked> Excluir sin posesión</label><label class="check"><input id="excludeNoKeys" type="checkbox" checked> Excluir sin llaves</label></div><div class="actions"><button class="btn" id="apply">Aplicar</button><button class="btn secondary" id="reset">Limpiar</button></div></div>
</aside>
<main class="results"><div class="summary"><strong id="count">Cargando…</strong><select class="sort" id="sort"><option value="score">Mejor coincidencia</option><option value="priceAsc">Precio: menor primero</option><option value="priceDesc">Precio: mayor primero</option><option value="area">Mayor superficie</option><option value="sqm">Menor €/m²</option><option value="newest">Más recientes</option></select></div><div id="active" class="chipsbar"></div><div id="list"></div></main>
<section class="detail" id="detail"><div class="empty">Selecciona una vivienda para ver la ficha completa.</div></section>
</div>
<script>
const URL="https://yxzvwjotsweqxmfurdme.supabase.co",KEY="sb_publishable_IbU9UqrVpmn_TWIub1BT9A_9ufY7w5p",db=supabase.createClient(URL,KEY);let properties=[],listings=[],images=[],sources=[],history=[],selected=null;const $=id=>document.getElementById(id),money=n=>n==null?"Precio no publicado":new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n),num=n=>n==null?"—":new Intl.NumberFormat("es-ES").format(n),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const active=p=>listings.filter(l=>l.property_id===p.id&&l.status==='active');function chk(id){return $(id).checked}function score(p,l){let s=0;if(p.occupancy_status==='vacant')s+=20;if(p.possession_status==='available')s+=20;if(p.elevator)s+=8;if(p.parking)s+=8;if(p.terrace)s+=6;if(p.exterior)s+=5;if(['renovated','good'].includes(p.condition))s+=7;if(l?.price_per_m2&&l.price_per_m2<5500)s+=8;return Math.min(99,s)}
function pass(p,l){if($("municipality").value&&p.municipality!==$("municipality").value)return false;if($("population").value&&p.population!==$("population").value)return false;if($("neighborhood").value&&p.neighborhood!==$("neighborhood").value)return false;const min=Number($("minPrice").value||0),max=Number($("maxPrice").value||0);if(min&&(l.price==null||Number(l.price)<min))return false;if(max&&(l.price==null||Number(l.price)>max))return false;if(Number($("minUseful").value||0)&&(p.surface_useful==null||Number(p.surface_useful)<Number($("minUseful").value)))return false;if(Number($("minBuilt").value||0)&&(p.surface_built==null||Number(p.surface_built)<Number($("minBuilt").value)))return false;if(Number($("minBeds").value||0)&&(p.bedrooms==null||Number(p.bedrooms)<Number($("minBeds").value)))return false;if(Number($("minBaths").value||0)&&(p.bathrooms==null||Number(p.bathrooms)<Number($("minBaths").value)))return false;if(chk('elevator')&&p.elevator!==true)return false;if(chk('parking')&&p.parking!==true)return false;if(chk('terrace')&&p.terrace!==true)return false;if(chk('exterior')&&p.exterior!==true)return false;if(chk('habitable')&&!['good','renovated','new'].includes(p.condition))return false;if(chk('available')&&p.possession_status!=='available')return false;if(chk('excludeOccupied')&&p.occupancy_status==='occupied')return false;if(chk('excludeRented')&&p.occupancy_status==='rented')return false;if(chk('excludeNoPossession')&&p.possession_status==='no_possession')return false;if(chk('excludeNoKeys')&&p.raw_no_keys===true)return false;return true}
function rows(){return properties.map(p=>{const ls=active(p),l=ls.slice().sort((a,b)=>(a.price==null?Infinity:Number(a.price))-(b.price==null?Infinity:Number(b.price)))[0];return l&&pass(p,l)?{p,l,score:score(p,l)}:null}).filter(Boolean)}function sourceName(id){return sources.find(s=>s.id===id)?.name||'Fuente'}function card(x){const im=images.find(i=>i.listing_id===x.l.id)?.image_url;return `<article class="card" data-id="${x.p.id}"><img class="thumb" loading="lazy" src="${esc(im||'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=700&q=80')}"><div class="cardbody"><span class="score">${x.score}/99</span><div><span class="source-badge">${esc(sourceName(x.l.source_id))}</span></div><div class="price">${money(x.l.price)}</div><div class="meta">${num(x.p.surface_useful??x.p.surface_built)} m² · ${x.p.bedrooms??'—'} hab. · ${x.p.bathrooms??'—'} baños</div><div class="title">${esc(x.l.title||x.p.address||'Vivienda')}</div><div class="chips">${x.p.municipality?`<span class="chip">${esc(x.p.municipality)}</span>`:''}${x.p.neighborhood?`<span class="chip">${esc(x.p.neighborhood)}</span>`:''}${x.p.elevator?'<span class="chip">Ascensor</span>':''}${x.p.parking?'<span class="chip">Parking</span>':''}${x.p.terrace?'<span class="chip">Terraza</span>':''}</div></div></article>`}
function render(){let r=rows(),s=$("sort").value;r.sort((a,b)=>s==='priceAsc'?((a.l.price??Infinity)-(b.l.price??Infinity)):s==='priceDesc'?((b.l.price??-Infinity)-(a.l.price??-Infinity)):s==='area'?((b.p.surface_useful??b.p.surface_built??0)-(a.p.surface_useful??a.p.surface_built??0)):s==='sqm'?((a.l.price_per_m2??Infinity)-(b.l.price_per_m2??Infinity)):s==='newest'?new Date(b.l.last_seen_at)-new Date(a.l.last_seen_at):b.score-a.score);$("count").textContent=`${r.length} ${r.length===1?'vivienda':'viviendas'}`;renderActive();$("list").innerHTML=r.length?r.map(card).join(''):`<div class="empty"><strong>No hay viviendas con estos filtros.</strong><br><br>Prueba a ampliar los criterios.</div>`;document.querySelectorAll('.card').forEach(e=>e.onclick=()=>detail(e.dataset.id))}
function renderActive(){const out=[];['municipality','population','neighborhood'].forEach(id=>{if($(id).value)out.push([$(id).value,id])});if($("minPrice").value)out.push(['≥ '+money(Number($("minPrice").value)),'minPrice']);if($("maxPrice").value)out.push(['≤ '+money(Number($("maxPrice").value)),'maxPrice']);if($("minUseful").value)out.push(['≥ '+$("minUseful").value+' m² útiles','minUseful']);if($("minBuilt").value)out.push(['≥ '+$("minBuilt").value+' m² construidos','minBuilt']);if($("minBeds").value)out.push(['≥ '+$("minBeds").value+' hab.','minBeds']);if($("minBaths").value)out.push(['≥ '+$("minBaths").value+' baños','minBaths']);['elevator','parking','terrace','exterior','habitable','available'].forEach(id=>{if(chk(id))out.push([$(id).parentElement.textContent.trim(),id])});$("active").innerHTML=out.map(x=>`<span class="active-chip" data-clear="${x[1]}">${esc(x[0])} ×</span>`).join('');document.querySelectorAll('[data-clear]').forEach(e=>e.onclick=()=>{$(e.dataset.clear).type==='checkbox'?$(e.dataset.clear).checked=false:$(e.dataset.clear).value='';locationOptions();render()})}
function detail(id){selected=id;const p=properties.find(x=>x.id===id),ls=active(p),ims=images.filter(i=>ls.some(l=>l.id===i.listing_id)).slice(0,8),h=history.filter(x=>ls.some(l=>l.id===x.listing_id)).sort((a,b)=>new Date(a.observed_at)-new Date(b.observed_at));if(!p)return;const prices=ls.map(l=>l.price).filter(v=>v!=null),min=prices.length?Math.min(...prices):null;$("detail").innerHTML=`${ims[0]?`<img class="hero" src="${esc(ims[0].image_url)}">`:''}${ims.length>1?`<div class="gallery">${ims.slice(1).map(i=>`<img src="${esc(i.image_url)}">`).join('')}</div>`:''}<div class="price">${money(min)}</div><div class="meta">${esc(p.address||'')} · ${esc(p.neighborhood||p.population||p.municipality||'')}</div><div class="metrics"><div class="metric"><b>${num(p.surface_useful??p.surface_built)}</b><span>m²</span></div><div class="metric"><b>${p.bedrooms??'—'}</b><span>habitaciones</span></div><div class="metric"><b>${p.bathrooms??'—'}</b><span>baños</span></div><div class="metric"><b>${esc(p.floor||'—')}</b><span>planta</span></div></div><div class="section"><b>Características</b><div class="kv">${kv('Ascensor',p.elevator)}${kv('Parking',p.parking)}${kv('Terraza',p.terrace)}${kv('Exterior',p.exterior)}${kv('Estado',p.condition)}${kv('Ocupación',p.occupancy_status)}${kv('Posesión',p.possession_status)}</div></div><div class="section"><b>Historial de precio</b>${h.length?h.map(x=>`<div class="source"><span>${new Date(x.observed_at).toLocaleDateString('es-ES')}</span><b>${money(x.price)}</b></div>`).join(''):'<div class="meta">Sin historial todavía</div>'}</div><div class="section"><b>Fuentes</b>${ls.map(l=>`<div class="source"><span><span class="source-badge">${esc(sourceName(l.source_id))}</span></span><a href="${esc(l.url)}" target="_blank" rel="noopener">Ver anuncio</a></div>`).join('')}</div>`}function kv(k,v){return `<div><span>${k}</span><b>${v===true?'Sí':v===false?'No':esc(v||'—')}</b></div>`}
function opts(a,first){return `<option value="">${first}</option>`+a.sort((x,y)=>x.localeCompare(y,'es')).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function locationOptions(){const m=$("municipality").value,p=$("population").value,n=$("neighborhood").value;const ms=[...new Set(properties.map(x=>x.municipality).filter(Boolean))];$("municipality").innerHTML=opts(ms,'Todos');$("municipality").value=m;const ps=[...new Set(properties.filter(x=>!m||x.municipality===m).map(x=>x.population).filter(Boolean))];$("population").innerHTML=opts(ps,'Todas');$("population").disabled=!ps.length;$("population").value=ps.includes(p)?p:'';const ns=[...new Set(properties.filter(x=>(!m||x.municipality===m)&&(!p||x.population===p)).map(x=>x.neighborhood).filter(Boolean))];$("neighborhood").innerHTML=opts(ns,'Todos');$("neighborhood").disabled=!ns.length;$("neighborhood").value=ns.includes(n)?n:''}
async function load(){const q=await Promise.all([db.from('properties').select('*'),db.from('listings').select('*'),db.from('listing_images').select('*'),db.from('sources').select('*').eq('active',true),db.from('price_history').select('*')]);const er=q.find(x=>x.error);if(er)throw er.error;[properties,listings,images,sources,history]=q.map(x=>x.data||[]);locationOptions();$("status").textContent=`Conectado · ${properties.length} inmuebles · ${listings.length} anuncios · ${sources.length} fuentes`;render()}
function reset(){document.querySelectorAll('aside input').forEach(i=>i.type==='checkbox'?i.checked=i.id.startsWith('exclude'):i.value='');$("municipality").value='';locationOptions();render()}
$("municipality").onchange=()=>{locationOptions();render()};$("population").onchange=()=>{locationOptions();render()};$("neighborhood").onchange=render;document.querySelectorAll('aside input').forEach(i=>i.addEventListener('change',render));$("sort").onchange=render;$("reset").onclick=reset;$("mobileReset").onclick=reset;$("apply").onclick=()=>{$("filters").style.display='';render()};$("open").onclick=()=>{$("filters").style.display='block'};load().catch(e=>{$("status").textContent='Error de conexión';console.error(e)})
</script></body></html>
