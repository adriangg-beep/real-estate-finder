<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Real Estate Finder</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17202a;--muted:#667085;--line:#e4e7ec;--accent:#1769aa;--accent2:#e8f1f8;--good:#16834b;--bad:#b42318;--shadow:0 2px 10px rgba(16,24,40,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select{font:inherit}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;justify-content:space-between;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:19px}.status{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:292px minmax(420px,1fr) 430px;min-height:calc(100vh - 68px)}
aside,.detail{background:#fff;padding:20px;border-right:1px solid var(--line)}aside{position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.detail{border-left:1px solid var(--line);border-right:0;position:sticky;top:68px;height:calc(100vh - 68px);overflow:auto}.results{padding:20px;min-width:0}
.filter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.filter-head h2{margin:0;font-size:17px}.mobile-close{display:none}
.filter-group{border-top:1px solid var(--line);padding:16px 0}.filter-group:first-of-type{border-top:0;padding-top:0}.group-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;color:#344054}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px 11px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:var(--text);min-height:40px}.field select:disabled{background:#f2f4f7;color:#98a2b3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.checks{display:grid;gap:8px}.check{display:flex;gap:9px;align-items:center;font-size:13px;min-height:28px}.check input{width:17px;height:17px}
.actions{display:flex;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:12px}.btn{border:0;background:var(--accent);color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.btn.secondary{background:#eef2f6;color:var(--text)}.btn.filter-mobile{display:none}
.summary{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.summary strong{font-size:15px}.sort{padding:9px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}
.chipsbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}.active-chip{background:var(--accent2);color:#13547f;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:650;cursor:pointer}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:220px 1fr;overflow:hidden;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}.card:hover{border-color:#c5d6e5;transform:translateY(-1px)}.thumb{width:220px;height:176px;object-fit:cover;background:#e9edf1}.cardbody{padding:14px}.price{font-size:21px;font-weight:800}.meta{color:var(--muted);font-size:13px;margin:5px 0 10px}.title{font-weight:700;margin-bottom:9px}.score{float:right;font-size:12px;font-weight:800;color:var(--good)}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font-size:11px;background:#f0f3f6;border-radius:999px;padding:5px 8px}.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.hero{width:100%;height:250px;object-fit:cover;border-radius:10px;background:#eef1f4;margin-bottom:14px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}.gallery img{width:100%;height:72px;object-fit:cover;border-radius:7px;background:#eef1f4}.detail .price{font-size:27px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}.metric{border:1px solid var(--line);border-radius:8px;padding:9px}.metric b{display:block;font-size:15px}.metric span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.section{border-top:1px solid var(--line);padding:15px 0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.kv div{display:flex;justify-content:space-between;gap:10px}.kv span{color:var(--muted)}.source{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.source a{color:var(--accent);text-decoration:none;font-weight:700}
.mobile-filterbar{display:none}
@media(max-width:1180px){.layout{grid-template-columns:270px 1fr}.detail{display:none}}
@media(max-width:720px){.top{height:60px;padding:0 14px}.layout{display:block;min-height:calc(100vh - 60px)}aside{display:none;position:fixed;inset:60px 0 0 0;z-index:30;height:auto;top:60px;padding:18px;overflow:auto;border:0}.mobile-filterbar{display:flex;position:sticky;top:60px;z-index:15;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;gap:8px}.mobile-filterbar .btn{flex:1}.btn.filter-mobile{display:block}.mobile-close{display:block;border:0;background:#eef2f6;border-radius:8px;padding:6px 10px}.results{padding:12px}.card{grid-template-columns:125px 1fr}.thumb{width:125px;height:150px}.cardbody{padding:12px}.price{font-size:18px}.summary{align-items:flex-start}.summary strong{padding-top:8px}.gallery{grid-template-columns:repeat(3,1fr)}.actions{position:sticky;bottom:0}}
</style>
</head>
<body>
<header class="top"><div class="brand">Real Estate Finder</div><div id="status" class="status">Conectando…</div></header>
<div class="mobile-filterbar"><button class="btn filter-mobile" id="openFilters">Filtros</button><button class="btn secondary" id="clearMobile">Limpiar</button></div>
<div class="layout">
<aside id="filters">
<div class="filter-head"><h2>Filtros</h2><button class="mobile-close" id="closeFilters">Cerrar</button></div>
<div class="filter-group"><div class="group-title">Ubicación</div><div class="field"><label>Municipio</label><select id="municipality"><option value="">Todos</option></select></div><div class="field"><label>Población</label><select id="population" disabled><option value="">Todas</option></select></div><div class="field"><label>Barrio</label><select id="neighborhood" disabled><option value="">Todos</option></select></div></div>
<div class="filter-group"><div class="group-title">Precio y superficie</div><div class="grid2"><div class="field"><label>Precio mínimo</label><input id="minPrice" type="number" min="0" step="5000" placeholder="€"></div><div class="field"><label>Precio máximo</label><input id="maxPrice" type="number" min="0" step="5000" placeholder="€"></div></div><div class="grid2"><div class="field"><label>m² útiles mín.</label><input id="minUseful" type="number" min="0"></div><div class="field"><label>m² construidos mín.</label><input id="minBuilt" type="number" min="0"></div></div><div class="grid2"><div class="field"><label>Habitaciones mín.</label><input id="minBeds" type="number" min="0"></div><div class="field"><label>Baños mín.</label><input id="minBaths" type="number" min="0"></div></div></div>
<div class="filter-group"><div class="group-title">Características</div><div class="checks"><label class="check"><input id="elevator" type="checkbox"> Ascensor</label><label class="check"><input id="parking" type="checkbox"> Parking</label><label class="check"><input id="terrace" type="checkbox"> Terraza</label><label class="check"><input id="exterior" type="checkbox"> Exterior</label><label class="check"><input id="habitable" type="checkbox"> Habitable</label><label class="check"><input id="available" type="checkbox"> Listo para entrar</label></div></div>
<div class="filter-group"><div class="group-title">Situación jurídica</div><div class="checks"><label class="check"><input id="excludeOccupied" type="checkbox" checked> Excluir ocupados</label><label class="check"><input id="excludeRented" type="checkbox" checked> Excluir alquilados</label><label class="check"><input id="excludeNoPossession" type="checkbox" checked> Excluir sin posesión</label><label class="check"><input id="excludeNoKeys" type="checkbox" checked> Excluir sin llaves</label></div><div class="actions"><button class="btn" id="apply">Aplicar filtros</button><button class="btn secondary" id="reset">Limpiar</button></div></div>
</aside>
<main class="results"><div class="summary"><strong id="count">Cargando…</strong><select class="sort" id="sort"><option value="score">Mejor coincidencia</option><option value="priceAsc">Precio: menor primero</option><option value="priceDesc">Precio: mayor primero</option><option value="area">Mayor superficie</option><option value="sqm">Menor €/m²</option><option value="newest">Más recientes</option></select></div><div id="activeFilters" class="chipsbar"></div><div id="list"></div></main>
<section class="detail" id="detail"><div class="empty">Selecciona una vivienda para ver la ficha completa.</div></section>
</div>
<script>
const SUPABASE_URL="https://yxzvwjotsweqxmfurdme.supabase.co";
const SUPABASE_KEY="sb_publishable_IbU9UqrVpmn_TWIub1BT9A_9ufY7w5p";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let properties=[],listings=[],images=[],sources=[],priceHistory=[],selected=null;
const $=id=>document.getElementById(id);const money=n=>n==null?"—":new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);const num=n=>n==null?"—":new Intl.NumberFormat("es-ES",{maximumFractionDigits:0}).format(n);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const activeListings=p=>listings.filter(l=>l.property_id===p.id&&l.status==="active");function check(id){return $(id).checked}function score(p,l){let s=0;if(p.occupancy_status==="vacant")s+=20;if(p.possession_status==="available")s+=20;if(p.elevator)s+=8;if(p.parking)s+=8;if(p.terrace)s+=6;if(p.exterior)s+=5;if(["renovated","good"].includes(p.condition))s+=7;if(l?.price_per_m2&&l.price_per_m2<5500)s+=8;return Math.min(99,s)}
function pass(p,l){if($("municipality").value&&p.municipality!==$("municipality").value)return false;if($("population").value&&p.population!==$("population").value)return false;if($("neighborhood").value&&p.neighborhood!==$("neighborhood").value)return false;const minP=Number($("minPrice").value||0),maxP=Number($("maxPrice").value||0);if(minP&&Number(l.price)<minP)return false;if(maxP&&Number(l.price)>maxP)return false;if(Number($("minUseful").value||0)&&Number(p.surface_useful||0)<Number($("minUseful").value))return false;if(Number($("minBuilt").value||0)&&Number(p.surface_built||0)<Number($("minBuilt").value))return false;if(Number($("minBeds").value||0)&&Number(p.bedrooms||0)<Number($("minBeds").value))return false;if(Number($("minBaths").value||0)&&Number(p.bathrooms||0)<Number($("minBaths").value))return false;if(check("elevator")&&p.elevator!==true)return false;if(check("parking")&&p.parking!==true)return false;if(check("terrace")&&p.terrace!==true)return false;if(check("exterior")&&p.exterior!==true)return false;if(check("habitable")&&!["good","renovated","new"].includes(p.condition))return false;if(check("available")&&p.possession_status!=="available")return false;if(check("excludeOccupied")&&p.occupancy_status==="occupied")return false;if(check("excludeRented")&&p.occupancy_status==="rented")return false;if(check("excludeNoPossession")&&p.possession_status==="no_possession")return false;if(check("excludeNoKeys")&&p.raw_no_keys===true)return false;return true}
function rows(){return properties.map(p=>{const ls=activeListings(p);const l=ls.sort((a,b)=>Number(a.price||0)-Number(b.price||0))[0];return l?{p,l,score:score(p,l)}:null}).filter(Boolean).filter(x=>pass(x.p,x.l))}
function render(){let r=rows(),s=$("sort").value;r.sort((a,b)=>s==="priceAsc"?a.l.price-b.l.price:s==="priceDesc"?b.l.price-a.l.price:s==="area"?(b.p.surface_useful||b.p.surface_built||0)-(a.p.surface_useful||a.p.surface_built||0):s==="sqm"?(a.l.price_per_m2||1e12)-(b.l.price_per_m2||1e12):s==="newest"?new Date(b.l.last_seen_at)-new Date(a.l.last_seen_at):b.score-a.score);$("count").textContent=`${r.length} ${r.length===1?"vivienda":"viviendas"}`;renderActive();$("list").innerHTML=r.length?r.map(card).join(""):`<div class="empty"><strong>No hay viviendas con estos filtros.</strong><br><br>Prueba a ampliar precio, superficie o ubicación.</div>`;document.querySelectorAll(".card").forEach(el=>el.onclick=()=>showDetail(el.dataset.id));if(selected&&r.some(x=>x.p.id===selected))showDetail(selected)}
function card(x){const im=images.find(i=>i.listing_id===x.l.id)?.image_url;return `<article class="card" data-id="${x.p.id}"><img class="thumb" loading="lazy" src="${esc(im||"https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=700&q=80")}"><div class="cardbody"><span class="score">${x.score}/99</span><div class="price">${money(x.l.price)}</div><div class="meta">${num(x.p.surface_useful||x.p.surface_built)} m² · ${x.p.bedrooms??"—"} hab. · ${x.p.bathrooms??"—"} baños${x.p.floor?` · planta ${esc(x.p.floor)}`:""}</div><div class="title">${esc(x.l.title)}</div><div class="chips">${x.p.municipality?chip(x.p.municipality):""}${x.p.neighborhood?chip(x.p.neighborhood):""}${x.p.elevator?chip("Ascensor"):""}${x.p.parking?chip("Parking"):""}${x.p.terrace?chip("Terraza"):""}</div></div></article>`}function chip(s){return `<span class="chip">${esc(s)}</span>`}
function renderActive(){const out=[];const m=$("municipality").value,p=$("population").value,n=$("neighborhood").value;if(m)out.push(["Municipio",m,"municipality"]);if(p)out.push(["Población",p,"population"]);if(n)out.push(["Barrio",n,"neighborhood"]);if($("maxPrice").value)out.push(["Máx. "+money(Number($("maxPrice").value)),null,"maxPrice"]);if($("minUseful").value)out.push(["≥ "+$("minUseful").value+" m² útiles",null,"minUseful"]);if($("minBeds").value)out.push(["≥ "+$("minBeds").value+" hab.",null,"minBeds"]);["elevator","parking","terrace","exterior","habitable","available"].forEach(id=>{if(check(id))out.push([$(id).parentElement.textContent.trim(),null,id])});$("activeFilters").innerHTML=out.map(([t,,id])=>`<span class="active-chip" data-clear="${id}">${esc(t)} ×</span>`).join("");document.querySelectorAll("[data-clear]").forEach(x=>x.onclick=()=>{const id=x.dataset.clear;if($(id).type==="checkbox")$(id).checked=false;else $(id).value="";if(["municipality","population","neighborhood"].includes(id))updateLocationOptions();render()})}
function showDetail(id){selected=id;const p=properties.find(x=>x.id===id);if(!p)return;const ls=activeListings(p);const ims=images.filter(i=>ls.some(l=>l.id===i.listing_id)).sort((a,b)=>(a.position||0)-(b.position||0));const hist=priceHistory.filter(h=>ls.some(l=>l.id===h.listing_id)).sort((a,b)=>new Date(a.observed_at)-new Date(b.observed_at));const hero=ims[0]?.image_url;$("detail").innerHTML=`${hero?`<img class="hero" src="${esc(hero)}">`:""}${ims.length>1?`<div class="gallery">${ims.slice(0,8).map(i=>`<img loading="lazy" src="${esc(i.image_url)}">`).join("")}</div>`:""}<div class="price">${money(Math.min(...ls.map(l=>Number(l.price)||Infinity)))}</div><div class="meta">${esc(p.address||"")} · ${esc(p.neighborhood||p.population||p.municipality||"")}, ${esc(p.province||"")}</div><div class="metrics"><div class="metric"><b>${num(p.surface_useful||p.surface_built)} m²</b><span>superficie</span></div><div class="metric"><b>${p.bedrooms??"—"}</b><span>habitaciones</span></div><div class="metric"><b>${p.bathrooms??"—"}</b><span>baños</span></div><div class="metric"><b>${esc(p.floor||"—")}</b><span>planta</span></div></div><div class="section"><h3>Características</h3><div class="kv">${kv("Ascensor",p.elevator)}${kv("Parking",p.parking)}${kv("Terraza",p.terrace)}${kv("Exterior",p.exterior)}${kv("Aire acondicionado",p.air_conditioning)}${kv("Calefacción",p.heating)}${kv("Estado",p.condition)}${kv("Ocupación",p.occupancy_status)}${kv("Posesión",p.possession_status)}</div></div><div class="section"><h3>Historial de precio</h3>${hist.length?hist.map(h=>`<div class="source"><span>${new Date(h.observed_at).toLocaleDateString("es-ES")}</span><b>${money(h.price)}</b></div>`).join(""):"<span class='meta'>Sin historial todavía</span>"}</div><div class="section"><h3>Fuentes</h3>${ls.map(l=>{const s=sources.find(z=>z.id===l.source_id);return `<div class="source"><span>${esc(s?.name||"Fuente")}</span><a href="${esc(l.url)}" target="_blank" rel="noopener">Ver anuncio</a></div>`}).join("")}</div>`}function kv(k,v){return `<div><span>${k}</span><b>${v===true?"Sí":v===false?"No":esc(v||"—")}</b></div>`}
function options(values,placeholder){return `<option value="">${placeholder}</option>`+values.sort((a,b)=>a.localeCompare(b,"es")).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("")}
function updateLocationOptions(){const m=$("municipality").value,p=$("population").value,n=$("neighborhood").value;const municipalities=[...new Set(properties.map(x=>x.municipality).filter(Boolean))];$("municipality").innerHTML=options(municipalities,"Todos");$("municipality").value=m;const pops=[...new Set(properties.filter(x=>!m||x.municipality===m).map(x=>x.population).filter(Boolean))];$("population").disabled=!m&&pops.length===0;$("population").innerHTML=options(pops,"Todas");$("population").value=pops.includes(p)?p:"";const ns=[...new Set(properties.filter(x=>(!m||x.municipality===m)&&(!p||x.population===p)).map(x=>x.neighborhood).filter(Boolean))];$("neighborhood").disabled=ns.length===0;$("neighborhood").innerHTML=options(ns,"Todos");$("neighborhood").value=ns.includes(n)?n:""}
async function load(){const [a,b,c,d,e]=await Promise.all([db.from("properties").select("*"),db.from("listings").select("*"),db.from("listing_images").select("*"),db.from("sources").select("*").eq("active",true),db.from("price_history").select("*")]);const err=[a,b,c,d,e].find(x=>x.error);if(err)throw err.error;properties=a.data||[];listings=b.data||[];images=c.data||[];sources=d.data||[];priceHistory=e.data||[];updateLocationOptions();$("status").textContent=`Conectado · ${properties.length} inmuebles · ${listings.length} anuncios`;render()}
$("municipality").onchange=()=>{updateLocationOptions();render()};$("population").onchange=()=>{updateLocationOptions();render()};$("neighborhood").onchange=render;document.querySelectorAll("aside input,aside select").forEach(x=>{if(!["municipality","population","neighborhood"].includes(x.id))x.addEventListener("change",render)});$("apply").onclick=()=>{render();$("filters").style.display="none"};$("reset").onclick=reset;$("clearMobile").onclick=reset;$("sort").onchange=render;$("openFilters").onclick=()=>{$("filters").style.display="block"};$("closeFilters").onclick=()=>{$("filters").style.display="none"};function reset(){document.querySelectorAll("aside input").forEach(i=>{if(i.type==="checkbox")i.checked=i.id.startsWith("exclude");else i.value=""});$("municipality").value="";updateLocationOptions();$("population").value="";$("neighborhood").value="";render()}load().catch(e=>{$("status").textContent="Error de conexión";$("list").innerHTML=`<div class="empty">No se han podido cargar los datos.</div>`;console.error(e)});
</script>
</body>
</html>
