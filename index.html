function updateMode(){operation=$("rentMode").classList.contains("active")?"rent":"sale";$("saleMode").classList.toggle("active",operation==="sale");$("rentMode").classList.toggle("active",operation==="rent");$("minPriceLabel").textContent=operation==="rent"?"Renta mínima / mes":"Precio mínimo";$("maxPriceLabel").textContent=operation==="rent"?"Renta máxima / mes":"Precio máximo";$("minPrice").step=operation==="rent"?"50":"5000";$("maxPrice").step=operation==="rent"?"50":"5000";$("priceTitle").textContent=operation==="rent"?"Renta y superficie":"Precio y superficie";$("excludeRentedRow").style.display=operation==="rent"?"none":"flex";$("furnishedRow").style.display=operation==="rent"?"flex":"none";$("sort").options[4].textContent=operation==="rent"?"Menor €/m²/mes":"Menor €/m²";updateLocationOptions();render()}
async function load(){const [a,b,c,d,e,f]=await Promise.all([db.from("properties").select("*"),db.from("listings").select("*"),db.from("listing_images").select("*"),db.from("sources").select("*").eq("active",true),db.from("price_history").select("*"),db.from("ui_assets").select("asset_key,content,mime_type").eq("asset_key","no-photos").maybeSingle()]);const err=[a,b,c,d,e,f].find(x=>x.error);if(err)throw err.error;properties=a.data||[];listings=b.data||[];images=c.data||[];sources=d.data||[];priceHistory=e.data||[];if(f.data?.content)noPhotoUrl=`data:${f.data.mime_type||"image/svg+xml"};utf8,${encodeURIComponent(f.data.content)}`;updateMode();$("status").textContent=`Conectado · ${properties.length} inmuebles · ${listings.length} anuncios`;render()}
$("saleMode").onclick=()=>{operation="sale";updateMode()};$("rentMode").onclick=()=>{operation="rent";updateMode()};$("municipality").onchange=()=>{updateLocationOptions();render()};$("population").onchange=()=>{updateLocationOptions();render()};$("neighborhood").onchange=render;document.querySelectorAll("aside input").forEach(x=>x.addEventListener("change",render));$("sort").onchange=render;$("apply").onclick=render;$("reset").onclick=()=>{document.querySelectorAll("aside input").forEach(i=>{if(i.type==="checkbox")i.checked=i.id.startsWith("exclude");else i.value=""});$("municipality").value="";$("population").value="";$("neighborhood").value="";render()};$("openFilters").onclick=()=>$("filters").style.display="block";$("closeFilters").onclick=()=>$("filters").style.display="none";$("clearMobile").onclick=()=>$("reset").click();load().catch(e=>{$("status").textContent="Error de conexión";$("list").innerHTML=`<div class="empty">No se han podido cargar los datos.</div>`;console.error(e)});
</script></body></html>
