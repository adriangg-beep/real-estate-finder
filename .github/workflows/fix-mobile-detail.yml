name: Fix mobile property detail

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          css_marker = '</style>'
          css = '''\n.mobile-detail-overlay{display:none}\n@media(max-width:720px){.mobile-detail-overlay{position:fixed;inset:60px 0 0;background:#fff;z-index:60;overflow:auto;padding:14px}.mobile-detail-overlay .mobile-detail-head{position:sticky;top:-14px;margin:-14px -14px 14px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}.mobile-detail-overlay .mobile-detail-head button{border:0;background:#eef2f6;border-radius:8px;padding:8px 12px;font-weight:700}.mobile-detail-overlay .detail{display:block;position:static;height:auto;border:0;padding:0}.mobile-detail-overlay .hero{height:230px}.mobile-detail-overlay .metrics{grid-template-columns:repeat(2,1fr)}}\n'''
          if '.mobile-detail-overlay' not in s:
              s = s.replace(css_marker, css + css_marker, 1)
              changed = True

          body_marker = '</body>'
          overlay = '''<div id="mobileDetailOverlay" class="mobile-detail-overlay"><div class="mobile-detail-head"><strong>Ficha de la vivienda</strong><button id="closeMobileDetail">Cerrar</button></div><div id="mobileDetailContent"></div></div>'''
          if 'id="mobileDetailOverlay"' not in s:
              s = s.replace(body_marker, overlay + body_marker, 1)
              changed = True

          hook = '''<script>\n(function(){\n  const overlay=document.getElementById('mobileDetailOverlay'),content=document.getElementById('mobileDetailContent'),close=document.getElementById('closeMobileDetail');\n  if(!overlay||!content||!close)return;\n  close.addEventListener('click',()=>overlay.style.display='none');\n  document.addEventListener('click',e=>{\n    const card=e.target.closest('.card');\n    if(!card)return;\n    setTimeout(()=>{\n      const detail=document.getElementById('detail');\n      if(!detail||!detail.innerHTML||detail.querySelector('.empty'))return;\n      content.innerHTML=detail.innerHTML;\n      overlay.style.display='block';\n      window.scrollTo(0,0);\n    },80);\n  },false);\n})();\n</script>\n'''
          if 'mobileDetailOverlay' in s and 'const overlay=document.getElementById' not in s:
              s = s.replace(body_marker, hook + body_marker, 1)
              changed = True

          # Clean the old duplicated map controls and old standalone map link.
          old_nested = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn secondary" id="viewList" type="button">Lista</button><button class="btn secondary" id="viewMap" type="button">Mapa</button></div><div id="unifiedMap" class="unified-map" style="display:none"></div></div>'
          old_link = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><a href="./map.html" style="text-decoration:none"><button class="btn secondary" type="button">Mapa</button></a></div>'
          if old_nested in s:
              s = s.replace(old_nested, '')
              changed = True
          if old_link in s:
              s = s.replace(old_link, '')
              changed = True

          # Remove any previously generated unified block/script, then create exactly one.
          import re
          ns = re.sub(r'<div[^>]*class="view-switch"[^>]*>.*?</div>', '', s, flags=re.S)
          ns = re.sub(r'<div[^>]*id="unifiedMap"[^>]*></div>', '', ns)
          ns = re.sub(r'\n?\.unified-map\{[^}]*\}\n?@media\(max-width:720px\)\{\.unified-map\{[^}]*\}\}\n?', '\n', ns)
          ns = re.sub(r'<script>\s*\(function\(\)\{\s*let mapMode=.*?</script>', '', ns, flags=re.S)
          if ns != s:
              s = ns
              changed = True

          map_css = '\n.unified-map{height:calc(100vh - 150px);min-height:500px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#e9edf1}\n@media(max-width:720px){.unified-map{height:calc(100vh - 145px);min-height:420px}}\n'
          if '.unified-map{' not in s:
              s = s.replace('</style>', map_css + '</style>', 1)
              changed = True

          controls = '<div class="view-switch" style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn secondary" id="viewList" type="button">Lista</button><button class="btn secondary" id="viewMap" type="button">Mapa</button></div><div id="unifiedMap" class="unified-map" style="display:none"></div>'
          if 'id="viewList"' not in s and 'id="viewMap"' not in s:
              marker = '<div class="summary">'
              if marker not in s:
                  raise SystemExit('summary marker not found')
              s = s.replace(marker, controls + marker, 1)
              changed = True

          map_js = r'''<script>
(function(){
  let mapMode=false, map=null, layer=null, leafletLoading=null;
  function loadLeaflet(){
    if(window.L) return Promise.resolve();
    if(leafletLoading) return leafletLoading;
    leafletLoading=new Promise((resolve,reject)=>{
      const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);
      const sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc);
    });
    return leafletLoading;
  }
  function rows(){
    const ps=(typeof properties!=='undefined'&&Array.isArray(properties))?properties:[];
    const out=[];
    ps.forEach(p=>{
      const lat=Number(p.latitude),lon=Number(p.longitude);
      if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<35||lat>44||lon<-10||lon>5)return;
      const ls=(typeof activeListings==='function'?activeListings(p):[]).filter(l=>l.status==='active');
      if(!ls.length)return;
      const l=ls.slice().sort((a,b)=>(Number(a.price)||Infinity)-(Number(b.price)||Infinity))[0];
      if(typeof pass==='function'&&!pass(p,l))return;
      out.push({p,l});
    });
    return out;
  }
  function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function popup(r){
    const p=r.p,l=r.l;
    const price=l.price==null?'—':new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(l.price));
    const area=p.surface_useful||p.surface_built;
    const legal=typeof legalStatuses==='function'?legalStatuses(p):[];
    return '<div style="min-width:210px"><div style="font-size:18px;font-weight:800">'+price+(operation==='rent'?'/mes':'')+'</div><div style="font-size:12px;color:#667085;margin:5px 0">'+(area?Math.round(Number(area))+' m² · ':'')+(p.bedrooms??'—')+' hab. · '+safe(p.population||p.municipality||'')+'</div>'+(legal.length?'<div style="font-size:11px;color:#b42318;font-weight:700;margin-bottom:5px">'+safe(legal.join(' · '))+'</div>':'')+'<a href="?property='+encodeURIComponent(p.id)+'" style="color:#1769aa;font-weight:700;text-decoration:none">Ver ficha</a></div>';
  }
  async function renderMap(){
    try{
      await loadLeaflet();
      const el=document.getElementById('unifiedMap');if(!el)return;
      if(!map){
        map=L.map(el).setView([41.3874,2.1686],12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
        layer=L.layerGroup().addTo(map);
      }
      layer.clearLayers();
      const rs=rows();
      rs.forEach(r=>L.marker([Number(r.p.latitude),Number(r.p.longitude)]).bindPopup(popup(r)).addTo(layer));
      if(rs.length)map.fitBounds(L.latLngBounds(rs.map(r=>[Number(r.p.latitude),Number(r.p.longitude)])),{padding:[30,30],maxZoom:15});
      setTimeout(()=>map.invalidateSize(),100);
    }catch(e){console.error('Unified map error',e)}
  }
  function setMode(toMap){
    mapMode=toMap;
    const list=document.getElementById('list'),el=document.getElementById('unifiedMap');
    if(list)list.style.display=toMap?'none':'';
    if(el)el.style.display=toMap?'block':'none';
    document.getElementById('viewList')?.classList.toggle('active',!toMap);
    document.getElementById('viewMap')?.classList.toggle('active',toMap);
    if(toMap)setTimeout(renderMap,50);
  }
  function refresh(){if(mapMode)setTimeout(renderMap,100)}
  window.addEventListener('load',()=>{
    document.getElementById('viewList')?.addEventListener('click',()=>setMode(false));
    document.getElementById('viewMap')?.addEventListener('click',()=>setMode(true));
    ['apply','reset','saleMode','rentMode','clearMobile','sort'].forEach(id=>document.getElementById(id)?.addEventListener('click',refresh));
    ['municipality','population','neighborhood'].forEach(id=>document.getElementById(id)?.addEventListener('change',refresh));
    document.querySelectorAll('aside input').forEach(el=>el.addEventListener('change',refresh));
  });
})();
</script>'''
          if 'Unified map error' not in s:
              s = s.replace('</body>', map_js + '</body>', 1)
              changed = True

          if changed:
              p.write_text(s, encoding='utf-8')
          else:
              print('No changes needed')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unify list and map view"
            git push
          fi
