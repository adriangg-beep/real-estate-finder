name: Add map view navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_nested='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn secondary" id="viewList" type="button">Lista</button><button class="btn secondary" id="viewMap" type="button">Mapa</button></div><div id="unifiedMap" class="unified-map" style="display:none"></div></div>'
          old_link='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><a href="./map.html" style="text-decoration:none"><button class="btn secondary" type="button">Mapa</button></a></div>'
          s=s.replace(old_nested,'')
          s=s.replace(old_link,'')
          s=re.sub(r'<div[^>]*class="view-switch"[^>]*>.*?</div>','',s,flags=re.S)
          s=re.sub(r'<div[^>]*id="unifiedMap"[^>]*></div>','',s)

          controls='<div class="view-switch" style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn secondary" id="viewList" type="button">Lista</button><button class="btn secondary" id="viewMap" type="button">Mapa</button></div><div id="unifiedMap" class="unified-map" style="display:none"></div>'
          marker='<div class="summary">'
          if marker not in s:
              raise SystemExit('summary marker not found')
          s=s.replace(marker,controls+marker,1)

          if '<script src="./unified-map.js"></script>' not in s:
              s=s.replace('</body>','<script src="./unified-map.js"></script></body>',1)

          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Nothing to commit"; else git commit -m "Unify list and map view"; git push; fi
