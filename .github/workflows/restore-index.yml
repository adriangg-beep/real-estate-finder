name: Restore and republish unified index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-index.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last working index
        run: |
          git show 9355f69c8c0f6064bc5f844a9e13be08a8071689:index.html > index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore working index before unified map patch' || exit 0
          git push
