name: Unify list and map

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/unify-list-map.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply unified view
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # The existing workflow patch is re-run through this commit to republish the unified view.
          # If the unified view is already present, leave the file unchanged.
          if 'id="viewMap"' not in s:
              old='<a href="./map.html" style="text-decoration:none"><button class="btn secondary" type="button">Mapa</button></a>'
              new='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><button class="btn secondary" id="viewList" type="button">Lista</button><button class="btn secondary" id="viewMap" type="button">Mapa</button></div><div id="unifiedMap" class="unified-map" style="display:none"></div>'
              if old in s: s=s.replace(old,new,1)
              else: raise SystemExit('Expected map navigation marker not found')
              p.write_text(s)
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Publish unified list map view'
          git push
