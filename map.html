<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa · Real Estate Finder</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f5f6f8;--panel:#fff;--text:#17202a;--muted:#667085;--line:#e4e7ec;--accent:#1769aa;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:relative;z-index:1000}.brand{font-weight:800}.top a{color:var(--accent);text-decoration:none;font-weight:700}.bar{background:#fff;border-bottom:1px solid var(--line);padding:9px 14px;display:flex;gap:8px;align-items:center;overflow:auto;white-space:nowrap}.bar button,.bar select,.bar input{font:inherit;border:1px solid #d0d5dd;border-radius:8px;background:#fff;padding:8px 10px}.bar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}.summary{font-size:13px;color:var(--muted);margin-left:auto}.mapwrap{position:relative;height:calc(100vh - 112px)}#map{height:100%;width:100%}.popup{min-width:190px}.popup .p{font-size:18px;font-weight:800;margin-top:6px}.popup .m{font-size:12px;color:var(--muted);margin:3px 0 7px}.popup a{color:var(--accent);font-weight:700;text-decoration:none}.special{color:var(--bad);font-size:11px;font-weight:700}.loading{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;z-index:500;box-shadow:0 2px 10px rgba(16,24,40,.12)}@media(max-width:720px){.top{height:58px}.bar{padding:8px}.mapwrap{height:calc(100vh - 106px)}.summary{margin-left:0}}</style></head><body><header class="top"><div class="brand">Real Estate Finder · Mapa</div><a href="./">← Listado</a></header><div class="bar"><button id="sale" class="active">Comprar</button><button id="rent">Alquilar</button><select id="municipality"><option value="">Todos los municipios</option></select><select id="population"><option value="">Todas las poblaciones</option></select><input id="min" type="number" placeholder="Precio mín."><input id="max" type="number" placeholder="Precio máx."><button id="apply">Aplicar</button><span id="summary" class="summary">Cargando…</span></div><div class="mapwrap"><div id="map"></div><div id="loading" class="loading">Cargando inmuebles…</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const SUPABASE_URL="https://yxzvwjotsweqxmfurdme.supabase.co",SUPABASE_KEY="sb_publishable_IbU9UqrVpmn_TWIub1BT9A_9ufY7w5p",db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let properties=[],listings=[],operation="sale",markers=L.layerGroup();const $=id=>document.getElementById(id),money=n=>n==null?"—":new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(Number(n)),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const map=L.map("map",{zoomControl:true}).setView([41.3874,2.1686],12);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);markers.addTo(map);function active(){return listings.filter(l=>l.status==="active"&&l.operation_type===operation)}function populate(){const ms=[...new Set(properties.map(p=>p.municipality).filter(Boolean))].sort((a,b)=>a.localeCompare(b));$("municipality").innerHTML='<option value="">Todos los municipios</option>'+ms.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("");updatePopulations()}function updatePopulations(){const m=$("municipality").value;const ps=[...new Set(properties.filter(p=>!m||p.municipality===m).map(p=>p.population).filter(Boolean))].sort((a,b)=>a.localeCompare(b));$("population").innerHTML='<option value="">Todas las poblaciones</option>'+ps.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}function render(){markers.clearLayers();const m=$("municipality").value,pop=$("population").value,min=Number($("min").value||0),max=Number($("max").value||0),ls=active(),shown=[];properties.forEach(p=>{const lat=Number(p.latitude),lon=Number(p.longitude);if(!Number.isFinite(lat)||!Number.isFinite(lon)||lat<35||lat>44||lon<-10||lon>5)return;if(m&&p.municipality!==m)return;if(pop&&p.population!==pop)return;const l=ls.find(x=>x.property_id===p.id);if(!l)return;if(min&&(l.price==null||Number(l.price)<min))return;if(max&&(l.price==null||Number(l.price)>max))return;shown.push({p,l})});shown.forEach(({p,l})=>{const special=Array.isArray(p.legal_statuses)&&p.legal_statuses.length?p.legal_statuses.join(" · "):"";const html=`<div class="popup"><div class="p">${money(l.price)}${operation==="rent"?"/mes":""}</div><div class="m">${p.built_area?Math.round(Number(p.built_area))+" m² · ":""}${p.bedrooms??"—"} hab. · ${esc(p.population||p.municipality||"")}</div>${special?`<div class="special">${esc(special)}</div>`:""}<a href="./?property=${encodeURIComponent(p.id)}">Ver ficha</a></div>`;L.marker([Number(p.latitude),Number(p.longitude)]).bindPopup(html).addTo(markers)});$("summary").textContent=`${shown.length} inmuebles · ${properties.length-shown.length} sin coordenadas/filtros`;if(shown.length){map.fitBounds(L.latLngBounds(shown.map(x=>[Number(x.p.latitude),Number(x.p.longitude)])),{padding:[30,30],maxZoom:15})}}async function load(){try{const [pr,li]=await Promise.all([db.from("properties").select("id,municipality,population,latitude,longitude,built_area,bedrooms,legal_statuses"),db.from("listings").select("id,property_id,price,status,operation_type").eq("status","active")]);if(pr.error)throw pr.error;if(li.error)throw li.error;properties=pr.data||[];listings=li.data||[];populate();render()}catch(e){console.error("MAP LOAD ERROR",e);$("summary").textContent="Error al cargar datos"}finally{$("loading").style.display="none"}}$("sale").onclick=()=>{operation="sale";$("sale").classList.add("active");$("rent").classList.remove("active");render()};$("rent").onclick=()=>{operation="rent";$("rent").classList.add("active");$("sale").classList.remove("active");render()};$("municipality").onchange=()=>{updatePopulations();render()};$("population").onchange=render;$("apply").onclick=render;load();</script></body></html>
